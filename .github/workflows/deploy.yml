name: Deploy Admin

on:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Check
        run: npx tsc -b

      - name: Lint Check
        run: npm run lint

  deploy:
    needs: validate
    runs-on: self-hosted

    steps:
      - name: Deploy Admin
        run: /usr/local/bin/deploy-admin
