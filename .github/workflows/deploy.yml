name: Deploy Admin

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: npm install

      - name: Build Admin
        run: npm run build

      - name: Deploy Admin
        run: sudo /usr/local/bin/deploy-admin
