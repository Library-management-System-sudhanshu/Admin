<!DOCTYPE html>
<html>
<head>
  <title>Redirecting to WhatsApp Web...</title>
</head>
<body>
  <script>
    const params = new URLSearchParams(window.location.search);
    const phone = params.get('phone') || '';
    const text = params.get('text') || '';
    window.location.href = `https://web.whatsapp.com/send?phone=${phone}&text=${encodeURIComponent(text)}`;
  </script>
</body>
</html>
